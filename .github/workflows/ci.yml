# CI for freelance-invoicing
#
# Generated by Blacksmith. You own this file — customize as needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The test database is built by the Flyway migrations and Hibernate
      # validates every entity against it, so a missing migration fails here.
      # JaCoCo writes its coverage report to build/reports/jacoco/.
      - name: Run tests
        run: ./gradlew test jacocoTestReport

      - name: Build
        run: ./gradlew bootJar
  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # src/api/generated/ is git-ignored, so the typed client is rebuilt from
      # the Spring schema before the frontend is type-checked or built. The
      # export runs the application in-process; no server listens.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Export OpenAPI schema
        run: ./gradlew exportOpenApi -Pout=../frontend/_schema.json
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate API client
        run: npx openapi-ts --input _schema.json --output src/api/generated

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
